# PolyMarketBotV1 config
# Active strategies + their per-strategy settings.
# Adding a strategy = drop a file in strategies/ and add a row to `active_strategies`.

paper:
  starting_bankroll: 500.00        # mirrors planned live bankroll
  max_position_usd: 15.00          # lowered from $50 to spread across many small positions
  max_open_positions: 15           # bumped from 6
  default_edge_threshold: 0.08     # 8% baseline (NO-side and non-longshot YES-side)
  default_kelly_fraction: 0.15     # 15% fractional Kelly  (unchanged)
  slippage_cents: 0.01             # 1c adverse on VWAP
  min_book_depth_usd: 50.00        # require cum ask depth within 5c >= $50
  max_spread_cents: 0.06           # skip spreads > 6c
  min_hours_to_resolve: 2.0        # skip if market closes in < 2h
  # Asymmetric YES-side longshot protection. When YES sells under
  # `longshot_yes_ask_cap` the relative impact of small model miscalibration
  # is large (a 2c P error at 5c is a 40% relative error). Require a steeper
  # edge on those bets; NO-side and YES-side at >= 0.15 ask use the default.
  # Applied in both pre-fill and post-fill edge checks.
  longshot_yes_ask_cap: 0.15
  longshot_yes_edge_threshold: 0.15

database:
  path: polymarketbot.db

scanner:
  gamma_url: https://gamma-api.polymarket.com
  clob_url: https://clob.polymarket.com
  page_limit: 500
  request_timeout: 30
  # Tags the scanner pulls. Strategies filter further via relevant_markets().
  tag_slugs:
    - highest-temperature
    - lowest-temperature

active_strategies:
  # - module: dummy   # used to bench-test the foundation before weather exists
  - module: weather
  - module: bucket_arb
  - module: cross_venue_arb
  - module: copy_trading

strategies:
  dummy:
    fixed_p: 0.65
    fixed_confidence: 1.0

  # Strategy #2: bucket-sum arbitrage detector. Operates at event level on
  # every Polymarket negRisk (MECE) event - scans the complete outcome set
  # for cases where SUM(YES asks) < $1 (YES arb) or SUM(NO asks) < $(N-1)
  # (NO arb). Logs every gap to arb_gaps; paper-trades only when locked
  # profit >= min_arb_profit USD.
  bucket_arb:
    safety_buffer: 0.005          # subtract from locked profit (slippage cushion)
    min_arb_profit: 1.00          # USD threshold to fire a paper trade
    target_shares: 100.0          # per-leg share target (capped by depth)
    walk_band: 0.10               # only walk books if gamma-snapshot sum is within this of arb threshold
    slippage_cents: 0.01          # per-leg adverse slippage on VWAP
    detect_yes: true              # scan YES-side gaps
    detect_no: true               # scan NO-side gaps
    execute_yes: true             # paper-fire above threshold YES
    execute_no: true
    min_hours_to_resolve: 1.0     # skip events resolving in less than this
    min_executable_shares: 5.0    # require at least this many fillable shares to log a full-walk gap
    max_walks_per_cycle: 2000     # hard cap on expensive full-book walks per cycle
    # Multi-outcome extension (Prompt A). Writes arb_multi rows alongside
    # the existing arb_gaps. Fixed USD-notional stake per set.
    multi_mode_enabled: true
    stake_notional_usd: 10.00
    min_net_gap_pct: 0.01         # 1% AFTER fees; below this -> observed_below_threshold
    max_open_multi_sets: 20
    # Polymarket fee schedule. CLOB exchange currently charges 0 protocol
    # fees; configurable so the math is always net of whatever fee is in
    # force when we run. Both pct apply on top of slippage.
    fee_maker_pct: 0.0
    fee_taker_pct: 0.0

  # Strategy #3: cross-venue arbitrage (Polymarket vs Kalshi). For each
  # candidate matched pair the rules-equivalence engine classifies into
  # CERTIFIED-IDENTICAL / FUZZY / NON-MATCH. Only CERTIFIED pairs are
  # auto-traded; FUZZY pairs are persisted for human review. Every
  # detected gap (even untradeable ones) is logged to cv_gaps so we can
  # measure the real cross-venue opportunity rate.
  cross_venue_arb:
    safety_buffer: 0.005          # USD per share, on top of slippage + fees
    min_arb_profit: 0.50          # USD - paper-fire threshold
    target_shares: 50.0           # per-leg share target (capped by depth)
    poly_slippage_cents: 0.01     # per-share adverse slippage on Polymarket VWAP
    kalshi_slippage_cents: 0.01   # per-share adverse slippage on Kalshi VWAP
    min_executable_shares: 5.0    # require this many fillable shares to log a gap
    min_hours_to_resolve: 1.0     # skip pairs resolving in less than this
    execute_fuzzy: false          # NEVER auto-trade FUZZY (source/cutoff/cond mismatch)
    kalshi_categories:            # Kalshi categories to scan (daily weather only by default)
      - Climate and Weather

  # Strategy #4: copy-trading (paper only). Public-data only; no auth.
  # Discovers candidate wallets via the global /trades tape +
  # operator-supplied seed_wallets, filters/scores per the build spec,
  # and paper-copies each ACTIVE roster wallet's new trades at the
  # current CLOB book (fixed $5 stake, pessimistic fill, 1c slippage).
  copy_trading:
    stake_usd: 5.00
    slippage_cents: 0.01
    max_open_total: 40
    max_open_per_leader: 8
    discovery_pages: 5             # global /trades pages to aggregate for candidates
    discovery_top_n: 200
    max_trade_pages_per_wallet: 20
    backtest_lookback_days: 90
    backtest_penalty_cents: 0.02   # historical fill penalty (no historical books)
    seed_wallets: []               # optional list of 0x... wallets to always include
    score_weights:
      roi_lifetime: 0.40
      consistency: 0.25
      niche_concentration: 0.20
      roi_recent: 0.15
    hard_filters:
      min_track_record_days: 90
      min_resolved_trades: 30
      max_avg_entry_price: 0.88
      max_days_since_last_trade: 14
      max_top_single_trade_share: 0.40
    hysteresis:
      roster_size: 15
      exit_below_rank: 25
      exit_below_consecutive: 3
      enter_above_rank: 10
      enter_above_consecutive: 2

  weather:
    edge_threshold: 0.08            # override default
    kelly_fraction: 0.15
    blend_raw_weight: 0.5           # 0.5 * raw_fraction + 0.5 * gaussian_p
    # Multi-family ensemble disagreement gate. Now generalized: any pair
    # of model families differing by > this in P triggers confidence drop.
    # Pre-bundle (GFS+IFS only) this was simply |P_gfs - P_ecmwf|.
    disagreement_threshold: 0.25
    low_confidence: 0.5
    # Family must have >= this many members to count toward the disagreement
    # gate. AIFS at 1 member always pools into the main estimate but does
    # not itself trigger the gate (single-member P is binary/uninformative).
    min_family_members_for_gate: 10
    clamp_min: 0.02
    clamp_max: 0.98
    forecast_days: 3
    dispute_threshold_degrees: 1.0  # WU vs OM diff this big -> DISPUTED
    # Open-Meteo ensemble models pulled per cycle. Hard-coded in
    # strategies/weather.py:DEFAULT_MODELS to keep the request stable; this
    # comment block documents the bundle and is for humans only.
    #   gfs_seamless      -> 31 GEFS members      (NCEP dynamical)
    #   ecmwf_ifs025      -> 51 IFS members       (ECMWF dynamical)
    #   ecmwf_aifs025     -> 51 AIFS members      (ECMWF AI ensemble)
    #   icon_seamless     -> 40 ICON EPS members  (DWD)
    # Total: 173 series (was 82 with GFS+IFS only).
    # Stations audited 2026-06-10 against live Gamma event descriptions for
    # both `highest-temperature` and `lowest-temperature` tags. See
