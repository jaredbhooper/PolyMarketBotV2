# PolyMarketBotV1 config
# Active strategies + their per-strategy settings.
# Adding a strategy = drop a file in strategies/ and add a row to `active_strategies`.

paper:
  starting_bankroll: 500.00        # mirrors planned live bankroll
  max_position_usd: 15.00          # lowered from $50 to spread across many small positions
  max_open_positions: 15           # bumped from 6
  default_edge_threshold: 0.08     # 8% baseline (NO-side and non-longshot YES-side)
  default_kelly_fraction: 0.15     # 15% fractional Kelly  (unchanged)
  slippage_cents: 0.01             # 1c adverse on VWAP
  min_book_depth_usd: 50.00        # require cum ask depth within 5c >= $50
  max_spread_cents: 0.06           # skip spreads > 6c
  min_hours_to_resolve: 2.0        # skip if market closes in < 2h
  # Asymmetric YES-side longshot protection. When YES sells under
  # `longshot_yes_ask_cap` the relative impact of small model miscalibration
  # is large (a 2c P error at 5c is a 40% relative error). Require a steeper
  # edge on those bets; NO-side and YES-side at >= 0.15 ask use the default.
  # Applied in both pre-fill and post-fill edge checks.
  longshot_yes_ask_cap: 0.15
  longshot_yes_edge_threshold: 0.15

database:
  path: polymarketbot.db

scanner:
  gamma_url: https://gamma-api.polymarket.com
  clob_url: https://clob.polymarket.com
  page_limit: 500
  request_timeout: 30
  # Tags the scanner pulls. Strategies filter further via relevant_markets().
  tag_slugs:
    - highest-temperature
    - lowest-temperature

active_strategies:
  # - module: dummy   # used to bench-test the foundation before weather exists
  - module: weather

strategies:
  dummy:
    fixed_p: 0.65
    fixed_confidence: 1.0

  weather:
    edge_threshold: 0.08            # override default
    kelly_fraction: 0.15
    blend_raw_weight: 0.5           # 0.5 * raw_fraction + 0.5 * gaussian_p
    # Multi-family ensemble disagreement gate. Now generalized: any pair
    # of model families differing by > this in P triggers confidence drop.
    # Pre-bundle (GFS+IFS only) this was simply |P_gfs - P_ecmwf|.
    disagreement_threshold: 0.25
    low_confidence: 0.5
    # Family must have >= this many members to count toward the disagreement
    # gate. AIFS at 1 member always pools into the main estimate but does
    # not itself trigger the gate (single-member P is binary/uninformative).
    min_family_members_for_gate: 10
    clamp_min: 0.02
    clamp_max: 0.98
    forecast_days: 3
    dispute_threshold_degrees: 1.0  # WU vs OM diff this big -> DISPUTED
    # Open-Meteo ensemble models pulled per cycle. Hard-coded in
    # strategies/weather.py:DEFAULT_MODELS to keep the request stable; this
    # comment block documents the bundle and is for humans only.
    #   gfs_seamless      -> 31 GEFS members      (NCEP dynamical)
    #   ecmwf_ifs025      -> 51 IFS members       (ECMWF dynamical)
    #   ecmwf_aifs025     -> 51 AIFS members      (ECMWF AI ensemble)
    #   icon_seamless     -> 40 ICON EPS members  (DWD)
    # Total: 173 series (was 82 with GFS+IFS only).
    # Stations audited 2026-06-10 against live Gamma event descriptions for
    # both `highest-temperature` and `lowest-temperature` tags. See
    # tools/audit_stations.py - re-run when Polymarket adds a new city.
    # Every coord comes from foundation/station_db.py (no city-name guesses).
