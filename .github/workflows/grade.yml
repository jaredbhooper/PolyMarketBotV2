# Daily grading job (sec 8). Settles yesterday's trades against the observed
# station temperature and updates Brier + P&L per strategy.
# Schedule: 10:00 UTC = mid-morning across all our cities' tz; comfortably
# after every Polymarket weather mkt for "yesterday" has resolved.

name: grade

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Shared with cycle.yml so the two workflows never race on `git push`.
  group: polymarketbot-state
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Grade
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py grade
          python main.py report

      - name: Commit ledger
        run: |
          git config user.name "polymarketbot"
          git config user.email "bot@users.noreply.github.com"
          git add polymarketbot.db || true
          if git diff --cached --quiet; then
            echo "no db changes to commit"
            exit 0
          fi
          git commit -m "grade $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push origin HEAD:main
