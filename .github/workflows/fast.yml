# V2 fast cadence: copy follower + sharpline poll + lp_sim. Every 5 min.
# Must be IDEMPOTENT and finish in under a minute - GitHub free-tier cron
# is jittery and can be delayed or skipped, so the job has to absorb
# either case. Detection delay is NOT a bug to hide: it's the primary
# measurement (price_drift on copied_trades, adverse_selection on
# sharpline_orders).

name: fast

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # `actions: write` is required so the wx-change-watch step can
  # `gh workflow run cycle.yml` for cities whose forecast hash flipped.
  # Without it `gh` falls back to a 403 and the dispatch is a no-op.
  actions: write

concurrency:
  group: polymarketbot-state
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
    # 6 minutes covers follow + sharpline-fill-cycle + wx-change-watch +
    # the dispatch loop. The change-watch step has its own internal
    # deadline (watch_deadline_minutes, default 2.5) so it exits cleanly
    # even when Open-Meteo is slow.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Persist cache.db across runs - see cycle.yml for the rationale.
      - name: Restore cache.db
        uses: actions/cache/restore@v4
        with:
          path: cache.db
          key: polymarketbot-cache-${{ github.run_id }}
          restore-keys: |
            polymarketbot-cache-

      - name: Fast strategies (copy follower + sharpline fill cycle)
        env:
          PYTHONUNBUFFERED: "1"
          # ODDS_API_KEY passed for symmetry but neither command below
          # burns Odds-API budget: follower hits data-api.polymarket.com;
          # sharpline-fill-cycle only checks the CLOB book against
          # already-posted resting orders. Fresh odds (and posting) live
          # in daily.yml, sized to the free-tier 450 req/month cap.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # All three commands are idempotent: cursor-tracked / nothing-
          # to-do if nothing changed. Any single failure does NOT block
          # the others (`|| true` swallows non-zero exits). LP-Sim moved
          # to cycle.yml because it requires a full Polymarket book scan
          # that doesn't fit fast.yml's 6-minute budget.
          python main.py follow || true
          python main.py sharpline-fill-cycle || true

      - name: Forecast-change watcher
        id: wx_change_watch
        env:
          PYTHONUNBUFFERED: "1"
        # Emits two GH outputs:
        #   trigger_cities  CSV of cities whose hash flipped AND cleared
        #                   the per-city 1/hr guard
        #   trigger_count   integer length of trigger_cities (for `if:`)
        run: |
          python main.py wx-change-watch || true

      - name: Dispatch cycle for changed cities
        if: steps.wx_change_watch.outputs.trigger_count != '' && steps.wx_change_watch.outputs.trigger_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Fan out one workflow_dispatch per armed city. cycle.yml accepts
        # a `tag` input which we use for traceability ("which forecast
        # change triggered this run?"); the cycle itself still scans the
        # full universe -- relevant_markets in WeatherStrategy filters
        # to the configured city set.
        run: |
          IFS=',' read -ra CITIES <<< "${{ steps.wx_change_watch.outputs.trigger_cities }}"
          for city in "${CITIES[@]}"; do
            [ -z "$city" ] && continue
            echo "::notice::dispatching cycle for forecast-change city=$city"
            gh workflow run cycle.yml -f tag="forecast-change:$city" || true
          done

      - name: Guard ledger.db size (must be <= 50 MB)
        run: |
          if [ -f ledger.db ]; then
            sz=$(stat -c%s ledger.db)
            echo "ledger.db size: $((sz/1024/1024)) MB ($sz bytes)"
            if [ "$sz" -gt 52428800 ]; then
              echo "::error::ledger.db exceeds 50 MB cap"
              exit 1
            fi
          fi

      - name: Commit ledger
        run: |
          git config user.name "polymarketbot"
          git config user.email "bot@users.noreply.github.com"
          git add ledger.db || true
          if git diff --cached --quiet; then
            echo "no db changes to commit"
            exit 0
          fi
          git commit -m "fast $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Save cache.db
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache.db
          key: polymarketbot-cache-${{ github.run_id }}
