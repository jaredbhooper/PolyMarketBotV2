# V2 fast cadence: copy follower + sharpline poll + lp_sim. Every 5 min.
# Must be IDEMPOTENT and finish in under a minute - GitHub free-tier cron
# is jittery and can be delayed or skipped, so the job has to absorb
# either case. Detection delay is NOT a bug to hide: it's the primary
# measurement (price_drift on copied_trades, adverse_selection on
# sharpline_orders).

name: fast

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # `actions: write` is required so the wx-change-watch step can
  # `gh workflow run cycle.yml` for cities whose forecast hash flipped.
  # Without it `gh` falls back to a 403 and the dispatch is a no-op.
  actions: write

concurrency:
  group: polymarketbot-state
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
    # 6 minutes covers follow + sharpline-fill-cycle + wx-change-watch +
    # the dispatch loop. The change-watch step has its own internal
    # deadline (watch_deadline_minutes, default 2.5) so it exits cleanly
    # even when Open-Meteo is slow.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          # `ref: main` (not the default github.sha) makes the checkout
          # atomic with the polymarketbot-state concurrency group: when
          # this job acquires the lock it fetches the LIVE main tip,
          # not the SHA from when the job was queued. Without this, a
          # job queued behind a long-running peer would check out the
          # stale queue-time SHA, then commit on a stale base, then
          # rebase-conflict on ledger.db at push time -- which silently
          # drops graded data when the Commit step masks the failure.
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Persist cache.db across runs - see cycle.yml for the rationale.
      - name: Restore cache.db
        uses: actions/cache/restore@v4
        with:
          path: cache.db
          key: polymarketbot-cache-${{ github.run_id }}
          restore-keys: |
            polymarketbot-cache-

      - name: Fast strategies (copy follower + sharpline fill cycle)
        env:
          PYTHONUNBUFFERED: "1"
          # ODDS_API_KEY passed for symmetry but neither command below
          # burns Odds-API budget: follower hits data-api.polymarket.com;
          # sharpline-fill-cycle only checks the CLOB book against
          # already-posted resting orders. Fresh odds (and posting) live
          # in daily.yml, sized to the free-tier 450 req/month cap.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # All three commands are idempotent: cursor-tracked / nothing-
          # to-do if nothing changed. Any single failure does NOT block
          # the others (`|| true` swallows non-zero exits). LP-Sim moved
          # to cycle.yml because it requires a full Polymarket book scan
          # that doesn't fit fast.yml's 6-minute budget.
          python main.py follow || true
          python main.py sharpline-fill-cycle || true

      - name: Forecast-change watcher
        id: wx_change_watch
        env:
          PYTHONUNBUFFERED: "1"
        # Emits two GH outputs:
        #   trigger_cities  CSV of cities whose hash flipped AND cleared
        #                   the per-city 1/hr guard
        #   trigger_count   integer length of trigger_cities (for `if:`)
        run: |
          python main.py wx-change-watch || true

      - name: Dispatch cycle for changed cities
        if: steps.wx_change_watch.outputs.trigger_count != '' && steps.wx_change_watch.outputs.trigger_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Fan out one workflow_dispatch per armed city. cycle.yml accepts
        # a `tag` input which we use for traceability ("which forecast
        # change triggered this run?"); the cycle itself still scans the
        # full universe -- relevant_markets in WeatherStrategy filters
        # to the configured city set.
        run: |
          IFS=',' read -ra CITIES <<< "${{ steps.wx_change_watch.outputs.trigger_cities }}"
          for city in "${CITIES[@]}"; do
            [ -z "$city" ] && continue
            echo "::notice::dispatching cycle for forecast-change city=$city"
            gh workflow run cycle.yml -f tag="forecast-change:$city" || true
          done

      - name: Guard ledger.db size (must be <= 100 MB)
        # GitHub's hard per-file limit is 100 MB. Cycle + daily run
        # the prune+vacuum step; fast.yml is too tight (<6 min) to
        # also vacuum every 5 minutes, so it just polices the cap.
        run: |
          if [ -f ledger.db ]; then
            sz=$(stat -c%s ledger.db)
            echo "ledger.db size: $((sz/1024/1024)) MB ($sz bytes)"
            if [ "$sz" -gt 104857600 ]; then
              echo "::error::ledger.db exceeds 100 MB cap"
              exit 1
            fi
          fi

      - name: Commit ledger
        # ledger.db is a single binary SQLite file written by all three
        # workflows. Binary files have no merge strategy: a true
        # conflict silently destroys one side's writes. But not every
        # remote divergence IS a binary conflict -- a code-only push
        # (yaml/py edits that don't touch ledger.db) can rebase
        # cleanly. So:
        #
        #   - try `git pull --rebase`: succeeds for code-only divergence
        #   - if rebase fails OR leaves any unresolved file: abort and
        #     exit 1 loudly (true binary conflict; another writer
        #     edited ledger.db between our checkout and our push)
        #   - post-push verification: re-fetch and assert our commit
        #     is on origin, else exit 1
        #
        # No `|| true` masks on any of these. Previous data-loss
        # incidents were 100% from `git pull --rebase ... || true`
        # silently dropping settled work.
        run: |
          set -euo pipefail
          git config user.name "polymarketbot"
          git config user.email "bot@users.noreply.github.com"
          git add ledger.db
          if git diff --cached --quiet; then
            echo "no db changes to commit"
            exit 0
          fi
          git commit -m "fast $(date -u +%Y-%m-%dT%H:%MZ)"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort 2>/dev/null || true
            echo "::error::rebase failed -- likely binary conflict on"
            echo "::error::ledger.db. Another writer edited ledger.db"
            echo "::error::between our checkout and this push. Failing"
            echo "::error::loudly to avoid silently dropping data."
            exit 1
          fi
          if git ls-files -u | grep -q .; then
            git rebase --abort 2>/dev/null || true
            echo "::error::unresolved files after rebase:"
            git ls-files -u
            exit 1
          fi
          git push origin HEAD:main
          git fetch origin main
          local_sha=$(git rev-parse HEAD)
          origin_sha=$(git rev-parse origin/main)
          if [ "$local_sha" != "$origin_sha" ]; then
            echo "::error::post-push verification failed:"
            echo "::error::  local HEAD:  $local_sha"
            echo "::error::  origin/main: $origin_sha"
            exit 1
          fi
          echo "push verified: $local_sha is on origin/main"

      - name: Save cache.db
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache.db
          key: polymarketbot-cache-${{ github.run_id }}
