# V2 fast cadence: copy follower + sharpline poll + lp_sim. Every 5 min.
# Must be IDEMPOTENT and finish in under a minute - GitHub free-tier cron
# is jittery and can be delayed or skipped, so the job has to absorb
# either case. Detection delay is NOT a bug to hide: it's the primary
# measurement (price_drift on copied_trades, adverse_selection on
# sharpline_orders).

name: fast

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: polymarketbot-state
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Persist cache.db across runs - see cycle.yml for the rationale.
      - name: Restore cache.db
        uses: actions/cache/restore@v4
        with:
          path: cache.db
          key: polymarketbot-cache-${{ github.run_id }}
          restore-keys: |
            polymarketbot-cache-

      - name: Fast strategies (copy follower + sharpline fill cycle)
        env:
          PYTHONUNBUFFERED: "1"
          # ODDS_API_KEY passed for symmetry but neither command below
          # burns Odds-API budget: follower hits data-api.polymarket.com;
          # sharpline-fill-cycle only checks the CLOB book against
          # already-posted resting orders. Fresh odds (and posting) live
          # in daily.yml, sized to the free-tier 450 req/month cap.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Both commands are idempotent: cursor-tracked / nothing-to-do
          # if nothing changed. Any single failure does NOT block the
          # other (`|| true` swallows non-zero exits). LP-Sim moved to
          # cycle.yml because it requires a full Polymarket book scan
          # that doesn't fit fast.yml's 4-minute budget.
          python main.py follow || true
          python main.py sharpline-fill-cycle || true

      - name: Guard ledger.db size (must be <= 50 MB)
        run: |
          if [ -f ledger.db ]; then
            sz=$(stat -c%s ledger.db)
            echo "ledger.db size: $((sz/1024/1024)) MB ($sz bytes)"
            if [ "$sz" -gt 52428800 ]; then
              echo "::error::ledger.db exceeds 50 MB cap"
              exit 1
            fi
          fi

      - name: Commit ledger
        run: |
          git config user.name "polymarketbot"
          git config user.email "bot@users.noreply.github.com"
          git add ledger.db || true
          if git diff --cached --quiet; then
            echo "no db changes to commit"
            exit 0
          fi
          git commit -m "fast $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Save cache.db
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache.db
          key: polymarketbot-cache-${{ github.run_id }}
