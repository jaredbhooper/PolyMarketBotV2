# V2 cycle: scan-decide-paper-trade every 30 minutes. Runs every strategy
# routed through main.py cycle (weather + bucket_arb + cross_venue_arb +
# logic_scan + lp_sim). The fast-cadence strategies (copy follower,
# sharpline) live in fast.yml so we don't burn a full cycle every 5 min.
#
# Free-tier cron drift is 5-15 min; irrelevant at this timescale.

name: cycle

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag_slug to restrict scan"
        required: false

permissions:
  contents: write

concurrency:
  # Shared with fast.yml + daily.yml so the three workflows never race on
  # the git push back to main. They all write ledger.db (cache.db is
  # gitignored and rebuildable - see foundation/ledger.py).
  group: polymarketbot-state
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    # 28 minutes: tight enough to leave 2 min of headroom before the
    # next 30-minute cron, loose enough that the v2.2 bucket_arb
    # (7-min budget) + cv (8-min budget) + tail strategies fit.
    # Bumping above 30 would create a permanent queue backup because
    # the next scheduled run can't start until this one releases the
    # concurrency group.
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          # `ref: main` (not the default github.sha) makes the checkout
          # atomic with the polymarketbot-state concurrency group: when
          # this job acquires the lock it fetches the LIVE main tip,
          # not the SHA from when the job was queued. See fast.yml for
          # the full rationale.
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # cache.db is gitignored + rebuildable. Persist it across runs via
      # the actions cache so we don't restart cold every cycle (the
      # scout / cv classifier / wallet history fetches would blow the
      # job timeout otherwise). Eviction by GitHub's LRU is harmless -
      # the next run rebuilds and re-saves.
      - name: Restore cache.db
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: cache.db
          key: polymarketbot-cache-${{ github.run_id }}
          restore-keys: |
            polymarketbot-cache-

      - name: Run cycle
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # v2.3: ONE python invocation handles everything inside the
          # master cycle_deadline_minutes. logic-scan, lp-sim, and
          # status are now invoked in-process by main.py cycle and
          # share the same deadline + universe -- the previous tail
          # python commands re-fetched the universe (~4 min each) and
          # routinely consumed all remaining workflow time.
          python main.py cycle

      - name: Prune + VACUUM ledger
        # cycle.yml writes the highest-churn rows on the ledger
        # (signals per relevant market per cycle, arb_multi observation
        # rows per walked event). Without per-cycle pruning the ledger
        # grew ~10 MB/day and tripped the size Guard within a week,
        # forcing every cycle's work to be discarded. Daily.yml already
        # prunes; mirror it here so 30-min cadence stays bounded.
        run: |
          python main.py vacuum || true

      - name: Guard ledger.db size (must be <= 100 MB)
        # GitHub's hard per-file limit is 100 MB. We commit ledger.db on
        # every cycle so an unbounded grow would eventually hit that
        # ceiling and silently fail the push. The Prune + VACUUM step
        # above keeps it well under, but the Guard remains as a
        # backstop -- a sudden jump indicates a regression in pruning
        # or a new unbounded log table.
        run: |
          if [ -f ledger.db ]; then
            sz=$(stat -c%s ledger.db)
            echo "ledger.db size: $((sz/1024/1024)) MB ($sz bytes)"
            if [ "$sz" -gt 104857600 ]; then
              echo "::error::ledger.db exceeds 100 MB cap"
              exit 1
            fi
          fi

      - name: Commit ledger
        # Rebase-with-conflict-guard; see fast.yml's Commit step for
        # the full rationale + design.
        run: |
          set -euo pipefail
          git config user.name "polymarketbot"
          git config user.email "bot@users.noreply.github.com"
          git add ledger.db
          if git diff --cached --quiet; then
            echo "no db changes to commit"
            exit 0
          fi
          git commit -m "cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort 2>/dev/null || true
            echo "::error::rebase failed -- likely binary conflict on"
            echo "::error::ledger.db. Another writer edited ledger.db"
            echo "::error::between our checkout and this push. Failing"
            echo "::error::loudly to avoid silently dropping data."
            exit 1
          fi
          if git ls-files -u | grep -q .; then
            git rebase --abort 2>/dev/null || true
            echo "::error::unresolved files after rebase:"
            git ls-files -u
            exit 1
          fi
          git push origin HEAD:main
          git fetch origin main
          local_sha=$(git rev-parse HEAD)
          origin_sha=$(git rev-parse origin/main)
          if [ "$local_sha" != "$origin_sha" ]; then
            echo "::error::post-push verification failed:"
            echo "::error::  local HEAD:  $local_sha"
            echo "::error::  origin/main: $origin_sha"
            exit 1
          fi
          echo "push verified: $local_sha is on origin/main"

      # Always save the cache, even if a step above failed - the partial
      # cache state still helps the next run avoid a cold restart.
      - name: Save cache.db
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache.db
          key: polymarketbot-cache-${{ github.run_id }}
