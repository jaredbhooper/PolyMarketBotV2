# V2 daily: scout + grade + master-report. Once per day.
# Scout rebuilds the copy-trading roster (hysteresis-protected); grade
# settles every strategy's resolved positions; master-report prints
# the full V2 scoreboard + health banner + per-strategy sections.

name: daily

on:
  schedule:
    # 10:00 UTC = mid-morning across our covered cities' timezones.
    # Comfortably after every Polymarket weather market for "yesterday"
    # has resolved.
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: polymarketbot-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    # 50 min headroom for cold-cache days. The scout has its own internal
    # budget (scout_time_budget_minutes, default 15) so even on a fresh
    # cache it exits cleanly with a partial roster rather than hanging.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          # `ref: main` (not the default github.sha) makes the checkout
          # atomic with the polymarketbot-state concurrency group: when
          # this job acquires the lock it fetches the LIVE main tip,
          # not the SHA from when the job was queued. See fast.yml for
          # the full rationale -- without this the previous build of
          # daily.yml silently dropped a graded settlement when it
          # committed onto a stale base.
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Persist cache.db across runs. Without this, daily.yml re-fetches
      # every candidate wallet's full /trades history from scratch on
      # every run - that blew the 30-min job timeout last night.
      - name: Restore cache.db
        uses: actions/cache/restore@v4
        with:
          path: cache.db
          key: polymarketbot-cache-${{ github.run_id }}
          restore-keys: |
            polymarketbot-cache-

      - name: Scout + sharpline POST + grade + master report
        env:
          PYTHONUNBUFFERED: "1"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # sharpline-post is daily-cadence on purpose: free Odds API tier
        # is 450 req/month (~15/day). 5 sports * 1 cycle/day = 5 req/day
        # = 150/month, comfortable under cap. fast.yml runs the
        # fill-detection lifecycle every 5 min; it never burns budget.
        run: |
          python main.py scout || true
          python main.py sharpline-post || true
          python main.py grade
          python main.py master-report
          python main.py autopsy-top -n 20 || true

      - name: Prune cache + VACUUM both DBs
        # Snapshots and *_gaps tables in cache.db accumulate ~MB/cycle.
        # Daily retention + VACUUM keeps cache.db bounded; VACUUM on
        # ledger.db reclaims pages from settled-then-closed positions.
        run: |
          python main.py vacuum

      - name: Guard ledger.db size (must be <= 100 MB)
        run: |
          if [ -f ledger.db ]; then
            sz=$(stat -c%s ledger.db)
            echo "ledger.db size: $((sz/1024/1024)) MB ($sz bytes)"
            if [ "$sz" -gt 104857600 ]; then
              echo "::error::ledger.db exceeds 100 MB cap"
              exit 1
            fi
          fi

      - name: Commit ledger
        # Fast-forward-only; binary ledger.db has no merge strategy.
        # See fast.yml's Commit step for the full rationale + design.
        run: |
          set -euo pipefail
          git config user.name "polymarketbot"
          git config user.email "bot@users.noreply.github.com"
          git add ledger.db
          if git diff --cached --quiet; then
            echo "no db changes to commit"
            exit 0
          fi
          git commit -m "daily $(date -u +%Y-%m-%d)"
          if ! git pull --ff-only origin main; then
            echo "::error::origin/main moved since checkout -- another"
            echo "::error::writer escaped the polymarketbot-state group."
            echo "::error::Failing loudly to avoid dropping settled data."
            exit 1
          fi
          git push origin HEAD:main
          git fetch origin main
          local_sha=$(git rev-parse HEAD)
          origin_sha=$(git rev-parse origin/main)
          if [ "$local_sha" != "$origin_sha" ]; then
            echo "::error::post-push verification failed:"
            echo "::error::  local HEAD:  $local_sha"
            echo "::error::  origin/main: $origin_sha"
            exit 1
          fi
          echo "push verified: $local_sha is on origin/main"

      - name: Save cache.db
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache.db
          key: polymarketbot-cache-${{ github.run_id }}
