# V2 daily: scout + grade + master-report. Once per day.
# Scout rebuilds the copy-trading roster (hysteresis-protected); grade
# settles every strategy's resolved positions; master-report prints
# the full V2 scoreboard + health banner + per-strategy sections.

name: daily

on:
  schedule:
    # 10:00 UTC = mid-morning across our covered cities' timezones.
    # Comfortably after every Polymarket weather market for "yesterday"
    # has resolved.
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: polymarketbot-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scout + grade + master report
        env:
          PYTHONUNBUFFERED: "1"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py scout || true
          python main.py grade
          python main.py master-report

      - name: Commit ledger
        run: |
          git config user.name "polymarketbot"
          git config user.email "bot@users.noreply.github.com"
          git add polymarketbot.db || true
          if git diff --cached --quiet; then
            echo "no db changes to commit"
            exit 0
          fi
          git commit -m "daily $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push origin HEAD:main
